# Desenvolvimento: `docker compose up -d db db-test` e `npm run dev`.
# O app igual à produção (mesma imagem do Dockerfile): `docker compose --profile app up --build`.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18: os dados ficam em /var/lib/postgresql/18/docker. Montar em
      # /var/lib/postgresql/data (caminho antigo) perderia os dados sem aviso.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 10

  # Banco descartável dos testes: os testes truncam tabelas.
  db-test:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app_test']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: [app]
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro da rede do compose o banco é `db`, não localhost.
      DATABASE_URL: postgres://app:app@db:5432/app
    ports:
      - '3000:3000'

volumes:
  db-data:
